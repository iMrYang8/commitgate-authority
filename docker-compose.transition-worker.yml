# Experimental P1 permission topology. This file is intentionally separate
# from docker-compose.yml: the default P0 server is not silently presented as
# transition-worker integrated. Start only with --profile p1-experimental.
services:
  transition-worker:
    profiles: ["p1-experimental"]
    build:
      context: .
      dockerfile: Dockerfile.transition-worker
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
    image: commitgate-transition-worker:experimental
    user: "10001:10001"
    environment:
      COMMITGATE_P1_TRANSITION_WORKER: experimental
    volumes:
      - p1-authoritative:/var/lib/commitgate/workspaces
      - p1-control:/var/lib/commitgate/control
      - p1-inbox:/var/lib/commitgate/inbox
      - p1-socket:/run/commitgate
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  launchpad-p1-api:
    profiles: ["p1-experimental"]
    build:
      context: .
      dockerfile: Dockerfile
    image: volc-agent-launchpad:p1-experimental
    depends_on:
      - transition-worker
    group_add: ["10001"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:?Set APP_AUTH_TOKEN to at least 24 URL-safe characters}
      APP_DATA_DIR: /app/data
      AGENT_WORKSPACE_ROOT: /app/workspaces
      COMMITGATE_CONTROL_ROOT: /app/commitgate-control
      COMMITGATE_P1_TRANSITION_WORKER: experimental
      TRANSITION_WORKER_SOCKET: /run/commitgate/transition-worker.sock
    ports:
      - "${P1_PUBLIC_PORT:-3001}:3000"
    volumes:
      # API sees both authority volumes read-only; only the worker has RW.
      - p1-authoritative:/app/workspaces:ro
      - p1-control:/app/commitgate-control:ro
      - p1-socket:/run/commitgate
      - p1-api-data:/app/data
      - p1-codex-home:/app/codex-home
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1

volumes:
  p1-authoritative:
  p1-control:
  p1-inbox:
  p1-socket:
  p1-api-data:
  p1-codex-home:
